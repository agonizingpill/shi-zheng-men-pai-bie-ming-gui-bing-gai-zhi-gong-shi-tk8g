name: ${COMPOSE_PROJECT_NAME:-address-merge}
x-app: &app
  build: ./backend
  environment:
    DATABASE_URL: mysql+pymysql://address:addresspass@db/address
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-address-merge-demo-change-me}
    SEED_DEMO: 'true'
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-address-merge}-frontend
    ports: ['${FRONTEND_PORT:-18235}:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD','wget','-q','-O','/dev/null','http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-address-merge}-backend
    ports: ['${BACKEND_PORT:-19235}:8000']
    healthcheck:
      test: ['CMD','python','-c','import urllib.request;urllib.request.urlopen("http://127.0.0.1:8000/health")']
      interval: 5s
      timeout: 4s
      retries: 30
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-address-merge}-worker
    command: ['python','-m','src.worker']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD','python','-c','import time,pathlib; assert time.time()-float(pathlib.Path("/artifacts/address-heartbeat").read_text())<20']
      interval: 5s
      timeout: 3s
      retries: 30
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-address-merge}-db
    environment:
      MYSQL_DATABASE: address
      MYSQL_USER: address
      MYSQL_PASSWORD: addresspass
      MYSQL_ROOT_PASSWORD: rootaddresspass
    ports: ['${DB_PORT:-17735}:3306']
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: ['CMD-SHELL','mysqladmin ping -h 127.0.0.1 -uaddress -paddresspass --silent']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-address-merge}-redis
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  db-data:
  redis-data:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.221.36.0/24}
